<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Log">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Derek's Life Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}
/* Layout: phone-first single column, sticky date header, fixed bottom tab bar like a training app. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --line:#d5dbe4;
  --fg:#121722; --muted:#5b6677; --accent:#1f56d0; --accent-fg:#ffffff; --accent-soft:#dfe8fb;
  --good:#1d8a4e; --warn:#b7791f; --bad:#c2372d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --surface:#151b24; --surface-2:#1d2531; --line:#2a3442;
  --fg:#e7ecf3; --muted:#96a2b4; --accent:#6f9cff; --accent-fg:#0c1016; --accent-soft:#1c2a47;
  --good:#4cc38a; --warn:#e0a84a; --bad:#f07167; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#151b24; --surface-2:#1d2531; --line:#2a3442;
  --fg:#e7ecf3; --muted:#96a2b4; --accent:#6f9cff; --accent-fg:#0c1016; --accent-soft:#1c2a47;
  --good:#4cc38a; --warn:#e0a84a; --bad:#f07167; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:none}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;height:34px;min-width:34px;font:inherit;font-weight:600;cursor:pointer;padding:0 8px}
.status{font-size:12px;color:var(--muted);padding-top:6px;min-height:18px}
.status.err{color:var(--bad)}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:20px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;background:var(--surface)}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .box::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--muted);width:62px;flex:none;padding-top:3px}
.check .l{flex:1;min-width:0}
.check .l b{display:block;font-weight:600}
.check .l span{font-size:13px;color:var(--muted)}
.check.on .l b{color:var(--muted);text-decoration:line-through}
.seg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.seg.ten{grid-template-columns:repeat(10,1fr)}
.seg button{height:38px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;height:40px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number],input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:80px;resize:vertical}
.water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.water .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.ex{border-bottom:1px solid var(--line);padding-block:12px}
.ex:last-child{border-bottom:0}
.ex .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.ex .sets input{text-align:center;font-variant-numeric:tabular-nums;padding:8px 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.alert{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goalgrid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}.tile .v{font-size:24px}.seg button{height:34px;font-size:13px}.check .t{width:56px}}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lock .brand{font-size:34px;text-align:center}
#lock input{font-size:18px;text-align:center;letter-spacing:.15em;padding:14px}
#lock .err{color:var(--bad);font-size:13px;text-align:center;min-height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<div id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <div class="brand">Life Log</div>
    <label for="pass" class="small muted" style="text-align:center">Enter your password</label>
    <input id="pass" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="btn primary" type="submit" style="height:48px">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand">Life Log<small id="sub"></small></div>
    <div class="datenav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button id="todayBtn">Today</button>
      <button id="next" aria-label="Next day">›</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <main id="app"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-view="today" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
  <button data-view="workout"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout</button>
  <button data-view="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
  <button data-view="plan"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Plan</button>
</div></nav>

<script>
(function(){
"use strict";
// ---------- Static plan (from Derek's Life Plan, Nov 23, 2026) ----------
var BLOCK_START = "2026-11-30";
var DOC_URL = "https://claude.ai/artifact/V321BKT7UdXC6Pa33QWSdK";

    {id:"sprints",n:"Bike or sled sprints",sr:"20s hard / 40s easy",sets:1,start:"10 rounds"},

    {id:"incdb",n:"Incline DB press",sr:"3x10",sets:3,start:"55s"},

  5:{name:"Lower, hinge",sauna:true,ex:[
    {id:"trapdl",n:"Trap bar deadlift",sr:"4x5",sets:4},
    {id:"bss",n:"Bulgarian split squat",sr:"3x8/leg",sets:3},
    {id:"hipthrust",n:"Hip thrust",sr:"3x10",sets:3},
    {id:"legext",n:"Leg extension",sr:"3x12",sets:3},
    {id:"boxjump",n:"Box jump",sr:"3x5",sets:3},
    {id:"walk15",n:"Incline walk",sr:"15 min",sets:1}]}
};
var CHECKUP = [
  {id:"bp",b:"Free pharmacy blood pressure reading",s:"CVS, Walgreens or Hannaford"},
  {id:"physical",b:"Book a physical",s:"Mention the woozy spells and the detached feeling, ask for standing BP"},
  {id:"labs",b:"Bloodwork done",s:"CBC, metabolic panel, A1c, TSH, iron/ferritin, B12, vitamin D, testosterone panel (7-10 AM), lipids, zinc, magnesium"},
  {id:"eye",b:"Eye exam",s:"Screens 8+ hours a day plus headaches"},

];
var DEFAULT_CONFIG = {startWeight:225,goalWeight:187,waterGoal:72,proteinGoal:190,checkup:{}};

// ---------- State ----------
var state = {config:clone(DEFAULT_CONFIG), days:{}, view:"today", date:todayKey(), loaded:false};
var db = null, saveTimers = {}, inflight = {}, queued = {}, needsRender = false;

function clone(o){return JSON.parse(JSON.stringify(o))}
function todayKey(){return keyOf(new Date())}
function keyOf(d){var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();return y+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function prettyDate(k){return parseKey(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function dow(k){return parseKey(k).getDay()}
function blockWeek(k){var diff=Math.round((parseKey(k)-parseKey(BLOCK_START))/864e5);return diff<0?0:Math.floor(diff/7)+1}
function emptyDay(k){return {date:k,checks:{},supps:{},water:0,woozy:null,headache:false,energy:null,weight:null,sauna:0,notes:"",workout:{done:false,sets:{}}}}
function day(k){if(!state.days[k])state.days[k]=emptyDay(k);var d=state.days[k];
  d.checks=d.checks||{};d.supps=d.supps||{};d.workout=d.workout||{done:false,sets:{}};d.workout.sets=d.workout.sets||{};return d}
function hasDay(k){return !!state.days[k]}

// ---------- DOM helper (all values set via textContent) ----------
function h(tag,attrs,kids){var el=document.createElement(tag);
  if(attrs)for(var a in attrs){var v=attrs[a];if(v==null||v===false)continue;
    if(a==="class")el.className=v;else if(a==="text")el.textContent=v;else if(a.slice(0,2)==="on")el.addEventListener(a.slice(2),v);
    else if(a==="value")el.value=v;else el.setAttribute(a,v===true?"":v)}
  (kids||[]).forEach(function(k){if(k==null||k===false)return;el.appendChild(typeof k==="string"?document.createTextNode(k):k)});return el}
var SVGNS="http://www.w3.org/2000/svg";
function s(tag,attrs){var el=document.createElementNS(SVGNS,tag);for(var a in attrs)el.setAttribute(a,attrs[a]);return el}

// ---------- Saving (on this phone) ----------
var STORE_KEY="lifelog.v1";
function setStatus(msg,err){var el=document.getElementById("status");el.textContent=msg||"";el.className="status"+(err?" err":"")}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify({v:1,savedAt:new Date().toISOString(),config:state.config,days:state.days}));setStatus("Saved on this phone")}
  catch(e){setStatus("Couldn't save. Your phone storage may be full. Make a backup in Plan.",true)}}
function saveDay(){clearTimeout(saveTimers.all);saveTimers.all=setTimeout(persist,300)}
function saveConfig(){saveDay()}
function flushNow(){if(saveTimers.all){clearTimeout(saveTimers.all);delete saveTimers.all;persist()}}
window.addEventListener("pagehide",flushNow);document.addEventListener("visibilitychange",function(){if(document.hidden)flushNow()});
function loadLocal(){try{var raw=localStorage.getItem(STORE_KEY);if(!raw)return;var o=JSON.parse(raw);
  if(o&&o.config)state.config=Object.assign(clone(DEFAULT_CONFIG),o.config);if(o&&o.days)state.days=o.days}catch(e){setStatus("Couldn't read saved data.",true)}}
function exportBackup(){var data=JSON.stringify({v:1,exportedAt:new Date().toISOString(),config:state.config,days:state.days},null,1);
  var blob=new Blob([data],{type:"application/json"}),name="life-log-backup-"+todayKey()+".json";
  var file=null;try{file=new File([blob],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Life Log backup"}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}

      else{document.getElementById("lockErr").textContent="Wrong password. Try again.";document.getElementById("pass").select()}})})})();
