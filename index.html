<style>
/* Layout: dark scoreboard look. Sticky header, card stack, fixed tab bar. Amber = you/lifting, cyan = cardio. */
:root{
  --bg:#090c13; --bg2:#0e1320; --surface:#121a2a; --surface-2:#1a2438; --line:#25314a;
  --fg:#eef2f8; --muted:#8a96ad; --dim:#5d6a82;
  --amber:#ffb21e; --amber-2:#ff8a00; --cyan:#2fd3ff; --cyan-2:#1a8cff;
  --good:#38e08a; --warn:#ffcc4d; --bad:#ff5a5f; --ink:#090c13;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#16213a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0;line-height:1}
.brand b{color:var(--amber)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--muted);text-transform:none;margin-top:4px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:34px;min-width:34px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:0 9px}
.status{font-size:12px;color:var(--dim);min-height:16px;text-align:right}
.status.err{color:var(--bad)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:19px;margin:24px 0 10px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--amber)}
h2.cy::before{background:var(--cyan)}
h3{font-size:15px;margin:0;font-weight:700}
.card{background:linear-gradient(180deg,var(--surface) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px} .dim{color:var(--dim)}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* Quote */
.quote{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 18px 16px;background:linear-gradient(135deg,#2a1a05 0%,#1a1306 35%,var(--surface) 100%);border:1px solid #4a3410}
.quote::after{content:"\201C";position:absolute;right:10px;top:-24px;font-family:Georgia,serif;font-size:140px;color:var(--amber);opacity:.13;line-height:1}
.quote .q{font-family:var(--display);font-weight:700;font-style:italic;font-size:24px;line-height:1.15;letter-spacing:.005em;text-wrap:balance;position:relative}
.quote .a{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
/* Rings */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ring{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ring svg{width:84px;height:84px;display:block}
.ring .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring .sub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.streak{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.streak .num{font-size:28px;color:var(--amber);line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:6px 0 7px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.week button .d{font-family:var(--display);font-size:18px;font-weight:800;color:var(--fg);line-height:1}
.week button i{width:22px;height:4px;border-radius:2px;background:var(--surface-2);display:block}
.week button.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
/* Checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;margin-top:0;background:var(--bg2);transition:background .15s,border-color .15s}
.check.on .box{background:var(--amber);border-color:var(--amber)}
.check.on .box::after{content:"";width:6px;height:12px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{font-family:var(--display);font-weight:700;font-size:16px;color:var(--amber);width:52px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.check .l{flex:1;min-width:0}
.check .l b{display:block;font-weight:600}
.check .l span{font-size:13px;color:var(--muted)}
.check.on .l b{color:var(--dim);text-decoration:line-through}
.check.on .t{color:var(--dim)}
/* Segmented score */
.seg{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.seg.ten{grid-template-columns:repeat(10,1fr)}
.seg button{height:40px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:9px;font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;padding:0}
.seg button.on{color:var(--ink);border-color:transparent}
/* Buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:12px;height:42px;padding:0 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.amber{background:linear-gradient(180deg,var(--amber),var(--amber-2));border-color:transparent;color:var(--ink)}
.btn.cyan{background:linear-gradient(180deg,var(--cyan),var(--cyan-2));border-color:transparent;color:var(--ink)}
.btn.on{background:var(--amber);border-color:transparent;color:var(--ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%;height:50px;font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input{font-family:var(--display);font-size:22px;font-weight:700;text-align:center;padding:6px 4px;letter-spacing:.02em}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields.four{grid-template-columns:repeat(4,1fr)}
/* Water */
.water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.water .big{font-size:52px;line-height:.9;color:var(--cyan)}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan-2),var(--cyan))}
.bar.am i{background:linear-gradient(90deg,var(--amber-2),var(--amber))}
/* Exercise */
.ex{border-bottom:1px solid var(--line);padding-block:14px}
.ex:first-child{padding-top:2px}.ex:last-child{border-bottom:0;padding-bottom:2px}
.ex .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex .sr{font-family:var(--display);font-weight:700;font-size:16px;color:var(--amber)}
.ex.cardio .sr{color:var(--cyan)}
.ex .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-top:10px}
.ex .sets input{text-align:center;font-family:var(--display);font-size:20px;font-weight:700;padding:7px 4px}
.ex .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.pill.cy{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.calc{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.calc b{font-family:var(--display);font-size:18px;color:var(--cyan);font-weight:700;margin-right:3px}
.kinds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kinds button{border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:10px;height:36px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0}
.kinds button.on{background:color-mix(in srgb,var(--cyan) 18%,transparent);border-color:var(--cyan);color:var(--cyan)}
.centry{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg2)}
/* Charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:2px}
.heat{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start}
.heat .days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:9px;color:var(--dim);font-weight:700;padding-top:1px}
.heat .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat .grid i{display:block;aspect-ratio:1;border-radius:4px;background:var(--bg2);border:1px solid var(--line);max-width:100%}
.lift{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .num{font-size:26px;color:var(--amber);text-align:right}
.alert{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 14%,var(--surface)),var(--bg2))}
table.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist th{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guide p{margin:0 0 8px} .guide ul{margin:0 0 8px;padding-left:18px} .guide li{margin-bottom:4px}
.guide .step{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.guide .step:last-child{border-bottom:0}
.guide .step .num{color:var(--cyan);font-size:20px}
/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--amber)}
/* Lock */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 60% at 50% 0%,#1d2a47 0%,var(--bg) 65%);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lock .brand{font-size:48px;text-align:center}
#lock input{font-size:20px;text-align:center;letter-spacing:.2em;padding:14px}
#lock .err{color:var(--bad);font-size:13px;text-align:center;min-height:18px}
/* Sprint timer */
#timer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .4s}
#timer.sprint{background:radial-gradient(90% 60% at 50% 40%,#5a1d00 0%,#1c0a02 70%)}
#timer.recover{background:radial-gradient(90% 60% at 50% 40%,#06304a 0%,#04121c 70%)}
#timer .top{display:flex;justify-content:space-between;align-items:center}
#timer .phase{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-top:8px}
#timer .clockwrap{flex:1;display:grid;place-items:center;min-height:0}
#timer svg{width:min(78vw,340px);height:auto}
#timer .clock{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
#timer .target{text-align:center;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.03em}
#timer .target small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
#timer .rounds{display:flex;justify-content:center;gap:6px;margin:12px 0}
#timer .rounds i{width:28px;height:8px;border-radius:4px;background:var(--surface-2)}
#timer .rounds i.done{background:var(--amber)}
#timer .rounds i.now{background:var(--fg)}
#timer .ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
@media (max-width:400px){.check .t{width:46px;font-size:15px}.seg button{height:36px;font-size:16px}.ring svg{width:74px;height:74px}.quote .q{font-size:22px}.fields.four{grid-template-columns:repeat(2,1fr)}.kinds button{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
